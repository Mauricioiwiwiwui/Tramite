<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110f"><title>Actas Certificadas · Santana Management</title><link rel="stylesheet" href="styles.css"></head><body><main class="main" style="margin-left:0;max-width:900px;margin-inline:auto"><div class="top"><div><div class="mobile-brand">SANTANA MANAGEMENT</div><h1>📄 Actas Certificadas</h1><p>Generador rescatado del proyecto original.</p></div><button class="icon-btn" onclick="location.href='index.html'">←</button></div><section class="panel"><label>Selecciona archivos PDF</label><input id="pdf-upload" type="file" accept="application/pdf" multiple><label>Estado</label><select id="state"></select><div class="tool-actions"><button class="primary" id="folio">Folio: activo</button><button class="primary" id="marco">Marco: activo</button><button class="primary" id="estado">Estado: activo</button></div><button class="primary" id="download">Procesar y descargar</button><p id="status" class="card-sub"></p></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>
const names=['AGUASCALIENTES','BAJA_CALIFORNIA','BAJA_CALIFORNIA_SUR','CAMPECHE','CHIHUAHUA','CHIAPAS','CIUDAD_DE_MEXICO','COLIMA','COAHUILA','DURANGO','GUERRERO','GUANAJUATO','HIDALGO','JALISCO','MICHOACAN_DE_OCAMPO','MEXICO','MORELOS','NAYARIT','NUEVO_LEON','OAXACA','PUEBLA','QUERETARO','QUINTANA_ROO','SAN_LUIS_POTOSI','SINALOA','SONORA','TAMAULIPAS','TABASCO','TLAXCALA','VERACRUZ','YUCATAN','ZACATECAS'];const s=document.getElementById('state');s.innerHTML=names.map(n=>`<option value="${n}.pdf">${n.replaceAll('_',' ')}</option>`).join('');let F=true,M=true,E=true;document.getElementById('folio').onclick=(e)=>{F=!F;e.currentTarget.textContent='Folio: '+(F?'activo':'apagado')};document.getElementById('marco').onclick=(e)=>{M=!M;e.currentTarget.textContent='Marco: '+(M?'activo':'apagado')};document.getElementById('estado').onclick=(e)=>{E=!E;e.currentTarget.textContent='Estado: '+(E?'activo':'apagado')};document.getElementById('download').onclick=async()=>{const files=[...document.getElementById('pdf-upload').files];const st=document.getElementById('status');if(!files.length){alert('Selecciona al menos un PDF.');return}st.textContent='Procesando…';try{for(const file of files){const user=await PDFLib.PDFDocument.load(await file.arrayBuffer());const out=await PDFLib.PDFDocument.create();const [up]=await out.embedPdf(user,[0]);const page=out.addPage([up.width,up.height]);if(M){const mb=await fetch('marco.pdf').then(r=>r.arrayBuffer());const [mp]=await out.embedPdf(mb,[0]);page.drawPage(mp,{x:0,y:0,width:up.width,height:up.height})}page.drawPage(up,{x:0,y:0,width:up.width,height:up.height});if(F){const fol=await fetch('folio.png').then(r=>r.arrayBuffer());const im=await out.embedPng(fol);page.drawImage(im,{x:0,y:0,width:page.getWidth(),height:page.getHeight()})}if(E){const sb=await fetch(s.value).then(r=>r.arrayBuffer());const [sp]=await out.embedPdf(sb,[0]);const p2=out.addPage([sp.width,sp.height]);p2.drawPage(sp)}const bytes=await out.save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download='Santana-'+file.name;a.click();try{const z=JSON.parse(localStorage.getItem('sm_stats')||'{\"uses\":0,\"downloads\":0,\"external\":0}');z.downloads=(z.downloads||0)+1;localStorage.setItem('sm_stats',JSON.stringify(z))}catch{}}st.textContent='Listo. Se generaron los archivos.'}catch(err){console.error(err);st.textContent='Ocurrió un error. Revisa los archivos y vuelve a intentar.'}};
</script></body></html>
